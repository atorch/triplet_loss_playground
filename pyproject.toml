[project]
name = "triplet-loss-playground"
version = "0.1.0"
description = "Triplet-loss embeddings on MNIST, and whether out-of-distribution inputs land somewhere different"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "imageio>=2.34",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "tensorflow>=2.18",
]

[project.optional-dependencies]
# Linux + NVIDIA only: pulls CUDA/cuDNN wheels so TensorFlow can use the GPU
gpu = ["tensorflow[and-cuda]>=2.18"]

[tool.uv]
package = false
